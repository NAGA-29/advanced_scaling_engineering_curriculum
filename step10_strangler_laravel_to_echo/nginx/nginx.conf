# nginx.conf — Strangler Fig Pattern: パスベースルーティング
# /heartbeat, /events -> Echo (新システム :8080)
# /api/legacy, /* -> Laravel (旧システム :8000)

user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'req_id=$http_x_request_id '
                    'upstream=$upstream_addr '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_types application/json text/plain application/xml;

    # ── Upstream 定義 ─────────────────────────────────────────────────────────
    # 新システム: Go/Echo
    upstream echo_backend {
        server localhost:8080;
        keepalive 32;
    }

    # 旧システム: Laravel
    upstream laravel_backend {
        server localhost:8000;
        keepalive 16;
    }

    # ── Server ───────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # リクエスト ID: 受け取るか、新規生成して全バックエンドに転送
        # (Nginx の $request_id は Nginx 1.11.0 以上で利用可能)
        set $req_id $http_x_request_id;
        if ($req_id = "") {
            set $req_id $request_id;
        }

        # ── 共通ヘッダ (全 location に適用) ──────────────────────────────────
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $req_id;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # ── /heartbeat → Echo (新システム) ───────────────────────────────────
        location = /heartbeat {
            proxy_pass http://echo_backend;
            add_header X-Handled-By "echo" always;
            add_header X-Request-ID $req_id always;
        }

        # ── /events → Echo (新システム) ──────────────────────────────────────
        location = /events {
            proxy_pass http://echo_backend;
            add_header X-Handled-By "echo" always;
            add_header X-Request-ID $req_id always;
        }

        # ── /api/v2/* → Echo (新システム: 新バージョン API) ──────────────────
        location /api/v2/ {
            proxy_pass http://echo_backend;
            add_header X-Handled-By "echo" always;
            add_header X-Request-ID $req_id always;
        }

        # ── /health → Echo (ヘルスチェック) ──────────────────────────────────
        location = /health {
            proxy_pass http://echo_backend;
            add_header X-Handled-By "echo" always;
            access_log off;
        }

        # ── /api/legacy/* → Laravel (旧システム) ─────────────────────────────
        location /api/legacy/ {
            proxy_pass http://laravel_backend;
            add_header X-Handled-By "laravel" always;
            add_header X-Request-ID $req_id always;
        }

        # ── /* → Laravel (旧システム: デフォルトフォールバック) ───────────────
        location / {
            proxy_pass http://laravel_backend;
            add_header X-Handled-By "laravel" always;
            add_header X-Request-ID $req_id always;
        }

        # ── エラーページ ──────────────────────────────────────────────────────
        error_page 502 503 504 /50x.json;
        location = /50x.json {
            default_type application/json;
            return 503 '{"error":"service_unavailable","message":"Backend temporarily unavailable"}';
        }
    }
}
