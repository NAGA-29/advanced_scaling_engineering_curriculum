# Redis 設定ファイル（ローカル開発用）

# バインドアドレス（全インターフェース）
bind 0.0.0.0

# ポート
port 6379

# パスワードなし（ローカル開発用。本番では requirepass を設定すること）
# requirepass yourpassword

# データ保存（AOF: Append-Only File）
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# メモリ上限（0 = 制限なし。実際の運用では設定すること）
# maxmemory 256mb

# メモリ上限時の eviction ポリシー
# allkeys-lru: すべてのキーを LRU で追い出す（キャッシュ用途に推奨）
# maxmemory-policy allkeys-lru

# スロークエリログ（1000 マイクロ秒 = 1ms 以上のコマンドを記録）
slowlog-log-slower-than 1000
slowlog-max-len 128

# Keyspace 通知（キャッシュ統計に使用）
notify-keyspace-events ""

# TCP バックログ
tcp-backlog 511
tcp-keepalive 300

# タイムアウト（0 = 無効）
timeout 0

# ログレベル
loglevel notice

# データベース数
databases 16
